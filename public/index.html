<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG</title>
<style>
  :root {
    --bg: #1a1a2e; --surface: #16213e; --border: #0f3460;
    --text: #e0e0e0; --dim: #888; --gold: #e2b714;
    --hp: #e74c3c; --xp: #3498db; --win: #2ecc71; --lose: #e74c3c;
    --gap: 0.75rem; --radius: 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }
  .hidden { display: none !important; }
  button {
    background: var(--border); color: var(--text); border: 1px solid var(--border);
    padding: 0.5rem 1rem; border-radius: var(--radius); cursor: pointer; font-family: inherit;
  }
  button:hover { background: #1a4a8a; }
  button:disabled { opacity: 0.4; cursor: default; }
  input {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 0.5rem; border-radius: var(--radius); font-family: inherit; width: 100%;
  }

  /* Login */
  #login { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #login form { background: var(--surface); padding: 2rem; border-radius: var(--radius); display: flex; flex-direction: column; gap: var(--gap); width: 280px; }
  #login h1 { text-align: center; color: var(--gold); }

  /* Game layout */
  #game { display: grid; grid-template-columns: 260px 1fr 240px; grid-template-rows: auto 1fr; height: 100vh; gap: 1px; background: var(--border); }
  .panel { background: var(--surface); padding: var(--gap); overflow-y: auto; }
  #header { grid-column: 1 / -1; display: flex; align-items: center; gap: 1rem; padding: 0.5rem var(--gap); }
  #header .name { color: var(--gold); font-weight: bold; }
  .bar-wrap { width: 120px; height: 14px; background: #111; border-radius: 3px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; transition: width 0.3s; }
  .bar-label { position: absolute; top: 0; left: 4px; font-size: 10px; line-height: 14px; }
  .hp-fill { background: var(--hp); }
  .xp-fill { background: var(--xp); }
  #stats-bar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .stat { font-size: 0.85rem; }
  .stat b { color: var(--gold); }

  /* Left panel */
  #location-panel h2 { color: var(--gold); margin-bottom: 0.5rem; font-size: 1rem; }
  #location-desc { color: var(--dim); font-size: 0.85rem; margin-bottom: var(--gap); }
  #actions { display: flex; flex-direction: column; gap: 0.4rem; }
  #actions button { text-align: left; font-size: 0.85rem; }
  #travel-list { margin-top: var(--gap); display: flex; flex-direction: column; gap: 0.4rem; }
  #travel-list button { font-size: 0.85rem; text-align: left; }
  h3 { font-size: 0.9rem; color: var(--dim); margin: 0.5rem 0 0.3rem; }

  /* Center panel */
  #main { display: flex; flex-direction: column; }
  #combat-log { flex: 1; overflow-y: auto; font-size: 0.85rem; padding-bottom: var(--gap); }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #111; }
  .log-win { color: var(--win); }
  .log-lose { color: var(--lose); }
  .log-info { color: var(--dim); }

  /* Right panel */
  #right-panel h3 { margin-top: 0; }
  .inv-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; padding: 3px 0; }
  .inv-item button { padding: 2px 8px; font-size: 0.75rem; }
  .shop-item { font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; }
  .shop-item .cost { color: var(--gold); }
  .shop-item button { padding: 2px 8px; font-size: 0.75rem; }
  .item-info { display: flex; flex-direction: column; }
  .item-desc { color: var(--dim); font-size: 0.75rem; }

  @media (max-width: 768px) {
    #game { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
  }
</style>
</head>
<body>

<div id="login">
  <form onsubmit="return doLogin(event)">
    <h1>RPG</h1>
    <input id="name-input" placeholder="Enter your name" maxlength="20" autofocus>
    <button type="submit">Play</button>
  </form>
</div>

<div id="game" class="hidden">
  <div id="header" class="panel">
    <span class="name" id="player-name"></span>
    <span class="stat">Lv <b id="player-level"></b></span>
    <div>
      <div class="bar-wrap"><div class="bar-fill hp-fill" id="hp-bar"></div><span class="bar-label" id="hp-text"></span></div>
    </div>
    <div>
      <div class="bar-wrap"><div class="bar-fill xp-fill" id="xp-bar"></div><span class="bar-label" id="xp-text"></span></div>
    </div>
    <span class="stat">ATK <b id="player-atk"></b></span>
    <span class="stat">DEF <b id="player-def"></b></span>
    <span class="stat" style="color:var(--gold)">Gold: <b id="player-gold"></b></span>
  </div>

  <div id="location-panel" class="panel">
    <h2 id="loc-name"></h2>
    <p id="location-desc"></p>
    <div id="actions"></div>
    <h3>Travel</h3>
    <div id="travel-list"></div>
  </div>

  <div id="main" class="panel">
    <div id="combat-log"></div>
  </div>

  <div id="right-panel" class="panel">
    <h3>Inventory</h3>
    <div id="inventory"></div>
    <div id="shop-section" class="hidden">
      <h3>Shop</h3>
      <div id="shop-list"></div>
    </div>
  </div>
</div>

<script>
let playerName = localStorage.getItem("rpg_name") || "";

const $ = (id) => document.getElementById(id);
const api = async (url, body) => {
  const opts = { headers: { "x-player-name": playerName, "Content-Type": "application/json" } };
  if (body) { opts.method = "POST"; opts.body = JSON.stringify(body); }
  const res = await fetch(url, opts);
  return res.json();
};

function doLogin(e) {
  e.preventDefault();
  const name = $("name-input").value.trim();
  if (!name) return;
  playerName = name;
  localStorage.setItem("rpg_name", name);
  $("login").classList.add("hidden");
  $("game").classList.remove("hidden");
  refresh();
  return false;
}

if (playerName) {
  $("login").classList.add("hidden");
  $("game").classList.remove("hidden");
  refresh();
}

async function refresh() {
  const data = await api("/api/status");
  if (data.error) { localStorage.removeItem("rpg_name"); location.reload(); return; }
  renderPlayer(data.player);
  renderLocation(data.location);
  renderInventory(data.inventory);
  renderShop(data.player.location === "town");
  renderLogs(data.logs);
}

function renderPlayer(p) {
  $("player-name").textContent = p.name;
  $("player-level").textContent = p.level;
  $("player-atk").textContent = p.attack;
  $("player-def").textContent = p.defense;
  $("player-gold").textContent = p.gold;
  const hpPct = Math.round((p.hp / p.max_hp) * 100);
  $("hp-bar").style.width = hpPct + "%";
  $("hp-text").textContent = `${p.hp}/${p.max_hp}`;
  const xpNeeded = p.level * 100;
  const xpPct = Math.round((p.xp / xpNeeded) * 100);
  $("xp-bar").style.width = xpPct + "%";
  $("xp-text").textContent = `${p.xp}/${xpNeeded}`;
}

function renderLocation(loc) {
  $("loc-name").textContent = loc.name;
  $("location-desc").textContent = loc.description;
  const acts = $("actions");
  acts.innerHTML = "";
  if (loc.monsters) {
    const btn = document.createElement("button");
    btn.textContent = "Explore (Fight)";
    btn.onclick = doExplore;
    acts.appendChild(btn);
  }
  if (loc.name === "Town") {
    const btn = document.createElement("button");
    btn.textContent = "Rest at Tavern (10g)";
    btn.onclick = doRest;
    acts.appendChild(btn);
  }
  const tl = $("travel-list");
  tl.innerHTML = "";
  (loc.travel || []).forEach((dest) => {
    const btn = document.createElement("button");
    btn.textContent = dest.charAt(0).toUpperCase() + dest.slice(1).replace("_", " ");
    btn.onclick = () => doTravel(dest);
    tl.appendChild(btn);
  });
}

function renderInventory(items) {
  const el = $("inventory");
  if (!items.length) { el.innerHTML = "<span style='color:var(--dim);font-size:0.85rem'>Empty</span>"; return; }
  el.innerHTML = items.map((i) => {
    const usable = i.item_key === "potion";
    return `<div class="inv-item"><span>${i.item_key.replace("_"," ")} x${i.quantity}</span>${usable ? `<button onclick="doUse('${i.item_key}')">Use</button>` : ""}</div>`;
  }).join("");
}

async function renderShop(show) {
  const sec = $("shop-section");
  if (!show) { sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  const data = await api("/api/shop");
  $("shop-list").innerHTML = Object.entries(data.items).map(([key, item]) =>
    `<div class="shop-item"><div class="item-info"><span>${item.name}</span><span class="item-desc">${item.description}</span></div><span class="cost">${item.cost}g</span><button onclick="doBuy('${key}')">Buy</button></div>`
  ).join("");
}

function renderLogs(logs) {
  $("combat-log").innerHTML = logs.reverse().map((l) => {
    let cls = "log-info";
    if (l.message.includes("Victory") || l.message.includes("Defeated ")) cls = "log-win";
    if (l.message.includes("Defeated by")) cls = "log-lose";
    return `<div class="log-entry ${cls}">${l.message}</div>`;
  }).join("");
}

function addCombatLines(lines) {
  const el = $("combat-log");
  const sep = document.createElement("div");
  sep.style.borderTop = "1px solid var(--border)";
  sep.style.margin = "0.3rem 0";
  el.appendChild(sep);
  lines.forEach((line) => {
    const div = document.createElement("div");
    div.className = "log-entry";
    if (line.includes("Victory")) div.classList.add("log-win");
    if (line.includes("defeated")) div.classList.add("log-lose");
    div.textContent = line;
    el.appendChild(div);
  });
  el.scrollTop = el.scrollHeight;
}

async function doExplore() {
  const data = await api("/api/explore", {});
  if (data.error) return alert(data.error);
  renderPlayer(data.player);
  addCombatLines(data.combatLog);
  if (!data.won) refresh();
}

async function doRest() {
  const data = await api("/api/rest", {});
  if (data.error) return alert(data.error);
  renderPlayer(data.player);
  addCombatLines([data.message]);
}

async function doTravel(dest) {
  const data = await api("/api/travel", { destination: dest });
  if (data.error) return alert(data.error);
  renderPlayer(data.player);
  renderLocation(data.location);
  renderShop(data.player.location === "town");
  addCombatLines([data.message]);
}

async function doBuy(item) {
  const data = await api("/api/buy", { item });
  if (data.error) return alert(data.error);
  renderPlayer(data.player);
  if (data.inventory) renderInventory(data.inventory);
  addCombatLines([data.message]);
}

async function doUse(item) {
  const data = await api("/api/use", { item });
  if (data.error) return alert(data.error);
  renderPlayer(data.player);
  if (data.inventory) renderInventory(data.inventory);
  addCombatLines([data.message]);
}
</script>
</body>
</html>
